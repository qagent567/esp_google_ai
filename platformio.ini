; PlatformIO Project Configuration File
; ESP32 + Google AI Studio (Gemini API) через Smart DNS (xbox-dns.ru)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Скорость Serial монитора
monitor_speed = 115200
upload_speed = 921600

; Зависимости библиотек
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; Опции сборки: оптимизация размера и буферов
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_RUNNING_CORE=1
